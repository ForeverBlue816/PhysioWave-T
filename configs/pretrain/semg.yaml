defaults: [base, model/wast_tare]
run_name: pretrain_semg
# LIMB / skeletal sEMG only.  Facial EMG has different generators, bandwidth and
# artefact structure and must not enter this corpus; the registry's `emg_region`
# field is checked before training starts.
data:
  modality: semg
  emg_region: limb
  synthetic:
    sampling_rate: 1000.0
    window_samples: 2048
model:
  modality: semg
  sampling_rate: 1000.0
  wast:
    patch_size: 64
    level: 3
    wavelet: bior4.4
  compression:
    num_queries: 8
  spatial:
    ssl:
      enabled: false      # explicit: a limb electrode array is not a sphere
    dyn:
      band_wise: false
pretrain:
  use_reference_consistency: false
  use_covariance: false
  lambda_wave: 0.5
  lambda_spec: 0.05
