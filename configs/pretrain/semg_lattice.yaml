defaults: [base, model/wast]
run_name: pretrain_semg_lattice
# LIMB / skeletal sEMG only; see configs/pretrain/semg.yaml for why.
#
# The channel-time lattice is preserved end to end. What gets removed is the
# per-scale token expansion the original PhysioWave introduced -- (J+1) copies
# of every channel-patch, one per decomposition level -- and nothing else:
#
#   legacy               (J+1) * C * S
#   this config                  C * S      <- same count the patcher produced
#   semg.yaml (K queries)        K * S      with K < C
#
# The middle row is the claim worth defending. A reviewer can ask what the model
# gave up to reach K*S and the answer is "channel evidence"; here the answer is
# "the duplicated scale axis", which the wavelet packs into features instead.
data:
  modality: semg
  emg_region: limb
  synthetic:
    sampling_rate: 1000.0
    window_samples: 2048
model:
  name: wast
  modality: semg
  sampling_rate: 1000.0
  # No TARE, no coordinates, no spatial graph, no channel compression. The
  # backbone's slot axis *is* the channel axis, and its slot embedding is the
  # per-channel identity -- which is all a fixed forearm array needs.
  channel_embedding: none
  use_spatial_frontend: false
  use_compression: false
  channel_reduction: none        # keep [B, C, S, D]; 'mean' would discard it
  wast:
    patch_size: 32               # 512-sample window -> S = 16 temporal positions.
                                 # At patch 64 there are only 8, and six layers of
                                 # temporal attention have very little to attend over.
    level: 3
    wavelet: bior4.4
    tokenizer: fold              # subbands into the feature axis, no synthesis
    fold_raw_residual: true      # start at a plain patch embedding, gate the
    fold_gate_init: 0.1          # wavelet path in
  backbone:
    depth: 6
    num_heads: 8
    slot_heads: 4
    dropout: 0.3                 # matches the DB5 setting that is working
    kv_wavelet_level: 0          # 1 halves the temporal K/V; see the note in
                                 # backbone.py before turning it on
pretrain:
  use_reference_consistency: false
  use_covariance: false
  lambda_wave: 0.5
  lambda_spec: 0.05
