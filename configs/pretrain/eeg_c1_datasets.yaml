# Per-corpus acquisition facts for the C1 multi-route pretraining pipeline.
#
# This file exists because the mains frequency is a property of the ROOM the
# data was recorded in, not of the pipeline, and getting it wrong is silent: a
# 50 Hz notch on 60 Hz data leaves the interference in and removes real signal
# at 50 Hz. Hard-coding it in the shell scripts put the same fact in six places.
#
# `powerline_hz` tells the preprocessor WHERE TO LOOK. It does not by itself
# authorise a notch -- see `notch_already_applied`. `verify_powerline_by_psd`
# makes `--inspect` measure the 49-51 and 59-61 Hz bands against their
# neighbours and report which one actually carries a peak, because two of these
# corpora publish no trustworthy PowerLineFrequency field.

faced:
  route: E32_512
  powerline_hz: 50
  verify_powerline_by_psd: true
  # 92 subjects at 1000 Hz, 31 at 250 Hz, in the SAME release. The 250 Hz
  # subjects reach 512 Hz only by upsampling; every shard written from one
  # carries upsampled_from_hz in its provenance so they can be excluded later
  # without reprocessing.
  expected_sampling_rates: [1000.0, 250.0]
  native_upsample_ok: [250.0]
  notes: >-
    BIDS metadata publishes PowerLineFrequency as n/a; 50 Hz is inferred from
    the acquisition site and must be confirmed by PSD before a full run.

tdbrain:
  route: E32_512
  powerline_hz: 50
  verify_powerline_by_psd: true
  expected_sampling_rates: [500.0]
  notes: >-
    26 recorded electrodes into 32 canonical slots; the 6 unrecorded slots stay
    zero with valid_channel_mask False. Analogue low-pass near 100 Hz at
    acquisition, so nothing above that is real regardless of the 512 Hz target.

physionet_mi:
  route: E64_256
  powerline_hz: 60
  verify_powerline_by_psd: true
  expected_sampling_rates: [160.0]
  native_upsample_ok: [160.0]
  notes: >-
    Source Nyquist is 80 Hz, so only the 60 Hz fundamental exists to remove --
    the notch runs at the native rate before resampling, so the 120 Hz harmonic
    is skipped automatically rather than applied to interpolated spectrum.

m3cv:
  route: E64_256
  powerline_hz: 50
  notch_already_applied: true
  verify_powerline_by_psd: false
  expected_sampling_rates: [250.0]
  native_upsample_ok: [250.0]
  notes: >-
    Published already cleaned: 0.01-200 Hz band-pass, 49-51 Hz notch, bad-channel
    interpolation, linked-mastoid reference, ICA ocular removal, 1000 -> 250 Hz.
    A second notch would be a second filter on an already-filtered band. This is
    NOT raw 1000 Hz data and must not be described as such.

hbn:
  route: E128_512
  powerline_hz: 60
  verify_powerline_by_psd: true
  expected_sampling_rates: [500.0]
  notes: >-
    EGI HydroCel 129 -> 128 by removing the named vertex reference, never by
    position. Standard releases R1-R11 only; the 100 Hz mini release and any
    "Not for Commercial Use" release are excluded from the main model.

hgd:
  route: E128_512
  powerline_hz: 50
  verify_powerline_by_psd: true
  expected_sampling_rates: [500.0]
  notes: >-
    Subject 14 has roughly half its sensors degraded in the official test split;
    per-recording slot coverage and the QC block record it. The task is repeated
    EXECUTED movement, not pure imagery, whatever the BIDS task label says.

tueg:
  route: E19_256
  powerline_hz: 60
  verify_powerline_by_psd: true
  notes: >-
    US clinical acquisition. Rate varies per recording; already processed.
