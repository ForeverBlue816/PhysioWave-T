# P300 (ERP-BCI) on a C1 pretrained encoder.
#
# THE STRONGEST TRANSFER THE CORPUS ALLOWS. The 58-channel montage
# EEG/physio_p300_finetune.py writes is 58 of E64_256's 64 slots, at 256 Hz,
# which is that route's sampling rate. So the pretrained WAVELET FRONTEND and
# PATCHER transfer as well as the transformer -- the montage goes in the
# route's slots by name and the six absent ones are masked, exactly as
# pretraining ran on every corpus that did not fill its route.
#
# The window is 512 samples, 2 s, against the route's 4 s. Nothing on the
# encoder path has a length baked in.
#
#   python -m physiowave.train.finetune_main --config finetune/eeg_c1_p300 \
#       --data-dir $PW_DATA_EEG/erpbci --num-classes 2 \
#       --set model.eeg_c1.pretrained=<exported.pth>
#
# THE CONTROL is the same command with that --set left off. Run both.
trainer: finetune
run_name: finetune_eeg_c1_p300

data:
  modality: eeg

model:
  name: eeg_c1
  # Shared with pretraining and not free: these describe the checkpoint being
  # loaded, and a mismatch is refused rather than reshaped.
  embed_dim: 384
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  norm: rmsnorm
  ffn: swiglu
  qk_norm: true
  max_level: 3
  wave_kernel_size: 16
  wavelet_names: [sym4, sym5, db6, sym8, db8]
  wave_init_mode: pad
  use_separate_channel: true
  fold_synthesis: 3
  fold_gamma: 0.1
  channel_encoding: id
  channel_embed_dim: 64
  # Fine-tuning is a different regime from masked pretraining: the input is no
  # longer corrupted, the objective is a small labelled set, and dropout is
  # doing what it is for.
  dropout: 0.1

  eeg_c1:
    route_id: E64_256          # 58 of its 64 slots, 256 Hz, 128-sample patches
    # in_channels, window_samples, sampling_rate and channel_names
    # come from the HDF5. Naming them here would be a second copy.
    patch_samples: 128
    # NOT mean. Mean pools over electrodes AND the four 500 ms patches, which
    # hands the head one vector per 2 s window -- and a P300 is a 250-500 ms
    # deflection, so that average is the ERP divided by four plus three patches
    # of everything else. `time` averages over electrodes only and keeps the
    # time axis, which is the shape EEGPT's probe has: a per-position
    # Linear(2048, 16), a flatten over the positions, then a Linear to logits.
    pool: time                 # project each position, then flatten
    probe_dim: 16              # their linear_probe1 width
    channel_pool: attn         # a learned query over electrodes, 384 parameters,
                               # instead of a flat mean. EEGPT's encoder hands
                               # its head channel-agnostic summary tokens and
                               # ours does not, so this is the cheapest way to
                               # let the head say WHERE as well as when.
    head_dropout: 0.5          # theirs, on both the probe and the fine-tune
    head_max_norm: 0.25        # LinearWithConstraint(240, 2, max_norm=0.25).
                               # An EEGNet-style row renorm, which on a few
                               # thousand labelled windows does the work weight
                               # decay on a 7k-parameter head cannot.
    spatial_filter: scale      # their chan_scale: one learnable gain per
                               # electrode, trained even under --freeze-encoder
                               # because it adapts the montage rather than
                               # representing it (their Table 8 ablates it)
    pretrained: null           # set it, or leave it for the control

# EEGPT's downstream budget, because the point of this run is to sit next to
# their row. Their linear_probe_EEGPT_PhysioP300.py: 100 epochs, batch 64,
# AdamW weight_decay=0.01, OneCycleLR max_lr=8e-4 pct_start=0.2, a plain
# CrossEntropyLoss, AUROC as the monitor.
train:
  epochs: 100
  warmup_ratio: 0.2            # OneCycle's pct_start, in steps not epochs, so
                               # it survives a change of epoch count
  lr: 5.0e-4                   # their 8e-4 trains ~33k probe parameters on a
                               # frozen encoder; this figure updates all 15M,
                               # so it is scaled down. The probe command passes
                               # --lr 1e-3 and is the one comparable to theirs.
  min_lr_ratio: 0.01
  weight_decay: 0.01           # theirs. 0.05 was ours and nothing chose it.
  batch_size: 64
  precision: bf16
  grad_clip: 1.0
  label_smoothing: 0.0         # EEGPT trains a plain CrossEntropyLoss. At 0.1
                               # the binary loss cannot go below 0.199 however
                               # well the model does, which reads in a log as a
                               # run that stopped learning.
  select_by: auroc             # their monitor score for a binary task
